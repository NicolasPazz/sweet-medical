name: CI Pipeline

on:
  push:
    branches: [main, develop, testing/e2e]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-app:
    name: ${{ matrix.package }} (${{ matrix.task }})
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
        task: [lint, test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Tarea
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017'
          MONGODB_DB_NAME: 'sweetmedical_ci_test'
        run: npm run ${{ matrix.task }}:${{ matrix.package }}

  e2e-tests:
    needs: verify-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias del Monorepo
        run: npm ci

      - name: Obtener versión de Playwright
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Caché de Navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-${{ steps.playwright-version.outputs.version }}

      - name: Instalar Dependencias del Sistema de Chromium (Si hay caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Instalar Chromium Completo (Si NO hay caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Pruebas E2E en Producción
        env:
          BASE_URL: 'https://sweetmedical.ddns.net'
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e --workspace=@sweet-medical/e2e

      - name: Subir Reporte E2E (Si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 3
