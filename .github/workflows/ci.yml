name: CI Pipeline

on:
  push:
    branches: [main, develop, testing/e2e]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-app:
    name: ${{ matrix.package }} (${{ matrix.task }})
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
        task: [lint, test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Tarea
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017'
          MONGODB_DB_NAME: 'sweetmedical_ci_test'
        run: npm run ${{ matrix.task }}:${{ matrix.package }}

  e2e-tests:
    needs: verify-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias del Monorepo
        run: npm ci

      - name: Ejecutar Pruebas E2E en Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: packages/e2e
          install: false
          start: npm --prefix ../.. run dev
          wait-on: http://localhost:3000
          command: npm run test:e2e
        env:
          BASE_URL: 'http://localhost:3000'
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Subir Artefactos de Cypress (Si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            packages/e2e/cypress/screenshots
            packages/e2e/cypress/videos
          retention-days: 3
